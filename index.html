<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chicago Marathon Spectator Planner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Chicago Marathon Spectator Planner</h1>
      <p>
        Enter your runner's start time and pace to see when they'll pass each mile —
        and a plan for where to watch. The link in your address bar always carries
        your inputs, so share it as-is.
      </p>
    </header>
    <main>
      <form id="inputs" autocomplete="off"></form>
      <div id="messages"></div>
      <div id="map"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
